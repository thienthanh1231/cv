<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study TikTok 2M+ Views</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#020617;
    color:#fff;
    margin:0;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.case-study-card{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:40px;
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:24px;
    padding:30px;
}

.video-thumb{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:18px;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border-radius:999px;
    background:#164e63;
    color:#22d3ee;
    font-weight:bold;
}

h1{
    font-size:48px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin:25px 0;
}

.stat-box{
    background:#111827;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.stat-box h3{
    color:#22d3ee;
    margin:0;
}

.btn{
    display:inline-block;
    padding:14px 24px;
    border-radius:10px;
    text-decoration:none;
    margin-right:10px;
    font-weight:bold;
}

.btn-primary{
    background:#22d3ee;
    color:#000;
}

.btn-secondary{
    border:1px solid #22d3ee;
    color:#22d3ee;
}

@media(max-width:992px){

.case-study-card{
    grid-template-columns:1fr;
}

.video-thumb{
    height:300px;
}

.stats{
    grid-template-columns:repeat(2,1fr);
}

.btn-home{
    background:#22d3ee;
    color:#000;
    padding:14px 28px;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
}



</style>
</head>

<body>
<div class="container">

<div class="case-study-card">

<div>

<img
src="images/tiktok-2m.jpg"
alt="TikTok Viral"
class="video-thumb">

</div>

<div>

<span class="badge">
🔥 CASE STUDY TIKTOK VIRAL
</span>

<h1>
Video TikTok Đạt Hơn 2 Triệu Lượt Xem
</h1>

<p>
Chiến dịch nội dung TikTok ngành in ấn quảng cáo giúp tăng mạnh độ nhận diện thương hiệu và thu hút khách hàng tiềm năng.
</p>

<div class="stats">

<div class="stat-box">
<h3>2M+</h3>
<p>Lượt xem</p>
</div>

<div class="stat-box">
<h3>128K+</h3>
<p>Lượt thích</p>
</div>

<div class="stat-box">
<h3>1.2K+</h3>
<p>Bình luận</p>
</div>

<div class="stat-box">
<h3>3.4K+</h3>
<p>Chia sẻ</p>
</div>

</div>

<div class="actions">

    <a href="https://www.tiktok.com/@inanquangcaosontruc/video/7438155876453584135"
       target="_blank"
       class="btn btn-primary">
       ▶ Xem Video
    </a>

    <a href="https://www.tiktok.com/@inanquangcaosontruc"
       target="_blank"
       class="btn btn-secondary">
       Kênh TikTok
    </a>

    <a href="index.html"
       class="btn btn-primary">
       🏠 Trang Chủ
    </a>

</div>
</div>

</div>

</div>

</body>
</html>
